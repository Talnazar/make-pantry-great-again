name: Deploy to Cloudflare Pages

# NOTE: This workflow was inherited from the upstream Hepilo project and is
# NOT wired up for this fork. It still points at the upstream's Cloudflare
# project, secrets, and env values. To avoid failing checks on every push it
# is set to manual-only (workflow_dispatch). Before enabling automatic
# deploys you must:
#   1. Replace the CLOUDFLARE_* secrets with your own.
#   2. Update the NUXT_PUBLIC_* env values below to your own site.
#   3. Remove the `working-directory: ./web` default (this fork has no ./web).
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./web

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
          pnpm run postinstall

      - name: Generate static site
        run: pnpm run generate
        env:
          NUXT_PUBLIC_APP_NAME: Pantry
          NUXT_PUBLIC_SITE_URL: https://pantry-doodoo.web.app

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=pantry
          workingDirectory: web
